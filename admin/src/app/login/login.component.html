<main class="adm-login">
  <div class="adm-login-brand"><span class="adm-brand"><span aria-hidden="true">F</span> FitConnect</span></div>
  <section class="adm-panel" aria-labelledby="admin-sign-in">
    <header class="adm-heading"><h1 id="admin-sign-in">Connexion administrateur</h1></header>
    <form class="adm-form" [formGroup]="form" (ngSubmit)="login()" [attr.aria-busy]="busy">
      <label>Adresse e-mail<input type="email" formControlName="email" autocomplete="username" required /></label>
      <label>Mot de passe<input type="password" formControlName="mp" autocomplete="current-password" required /></label>
      <p *ngIf="error" class="adm-notice adm-error" role="alert">{{ error }}</p>
      <button class="adm-button" type="submit" [disabled]="busy">{{ busy ? 'Connexion…' : 'Se connecter' }}</button>
    </form>
  </section>
</main>
