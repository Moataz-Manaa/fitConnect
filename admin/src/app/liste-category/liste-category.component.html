<header class="adm-heading adm-heading-actions">
  <h1>Catégories</h1>
</header>
<form class="adm-panel adm-toolbar adm-category-form" (ngSubmit)="addCategory(table)" [attr.aria-busy]="saving">
  <label>Nouvelle catégorie<input type="text" name="name" [(ngModel)]="name" required /></label>
  <button class="adm-button" type="submit" [disabled]="saving || table.loading || table.saving">{{ saving ? 'Ajout…' : 'Ajouter' }}</button>
  <p *ngIf="error" class="adm-notice adm-error" role="alert">{{ error }}</p>
</form>
<app-management-table #table title="Catégories"
  [columns]="['ID','Nom']"
   [hasActions]="true" [loadRows]="loadRows" [actionsDisabled]="saving"></app-management-table>
