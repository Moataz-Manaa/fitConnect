<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      Sales Dashboard | Osen - Responsive Bootstrap 5 Admin Dashboard
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      content="A fully featured admin theme which can be used to build CRM, CMS, etc."
      name="description"
    />
    <meta content="Coderthemes" name="author" />
  </head>

  <body>
    <div class="wrapper">
      <app-menu></app-menu>

      <header class="app-topbar">
        <app-header></app-header>
      </header>

      <div
        class="modal fade"
        id="searchModal"
        tabindex="-1"
        aria-labelledby="searchModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-lg">
          <div class="modal-content bg-transparent">
            <div class="card mb-1">
              <div
                class="px-3 py-2 d-flex flex-row align-items-center"
                id="top-search"
              >
                <i class="ti ti-search fs-22"></i>
                <input
                  type="search"
                  class="form-control border-0"
                  id="search-modal-input"
                  placeholder="Search for actions, people,"
                />
                <button
                  type="button"
                  class="btn p-0"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                >
                  [esc]
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-content">
        <div class="page-container">
          <div class="row">
            <div class="col-12">
              <div
                class="page-title-head d-flex align-items-sm-center flex-sm-row flex-column"
              >
                <div class="flex-grow-1">
                  <h4 class="fs-18 fw-semibold m-0">Dashboard</h4>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col">
              <div
                class="row row-cols-xxl-4 row-cols-md-2 row-cols-1 text-center"
              >
                <div class="col">
                  <div class="card">
                    <div class="card-body">
                      <h5
                        class="text-muted fs-13 text-uppercase"
                        title="Number of Orders"
                      >
                        Administrateurs
                      </h5>
                      <div
                        class="d-flex align-items-center justify-content-center gap-2 my-2 py-1"
                      >
                        <div class="user-img fs-42 flex-shrink-0">
                          <span
                            class="avatar-title text-bg-primary rounded-circle fs-22"
                          >
                            <span class="menu-icon"
                              ><i class="ti ti-user-circle"></i
                            ></span>
                          </span>
                        </div>
                        <h3 class="mb-0 fw-bold">{{ totalAdmin }}</h3>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col">
                  <div class="card">
                    <div class="card-body">
                      <h5
                        class="text-muted fs-13 text-uppercase"
                        title="Number of Orders"
                      >
                        Clients
                      </h5>
                      <div
                        class="d-flex align-items-center justify-content-center gap-2 my-2 py-1"
                      >
                        <div class="user-img fs-42 flex-shrink-0">
                          <span
                            class="avatar-title text-bg-primary rounded-circle fs-22"
                          >
                            <i class="fa-solid fa-user"></i>
                          </span>
                        </div>
                        <h3 class="mb-0 fw-bold">{{ totalClient }}</h3>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col">
                  <div class="card">
                    <div class="card-body">
                      <h5
                        class="text-muted fs-13 text-uppercase"
                        title="Number of Orders"
                      >
                        Salle de sport
                      </h5>
                      <div
                        class="d-flex align-items-center justify-content-center gap-2 my-2 py-1"
                      >
                        <div class="user-img fs-42 flex-shrink-0">
                          <span
                            class="avatar-title text-bg-primary rounded-circle fs-22"
                          >
                            <i class="fa-solid fa-dumbbell"></i>
                          </span>
                        </div>
                        <h3 class="mb-0 fw-bold">
                          {{ totalSalle }}
                        </h3>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col">
                  <div class="card">
                    <div class="card-body">
                      <h5
                        class="text-muted fs-13 text-uppercase"
                        title="Number of Orders"
                      >
                        Coach Privé
                      </h5>
                      <div
                        class="d-flex align-items-center justify-content-center gap-2 my-2 py-1"
                      >
                        <div class="user-img fs-42 flex-shrink-0">
                          <span
                            class="avatar-title text-bg-primary rounded-circle fs-22"
                          >
                            <i class="ti ti-stretching"></i>
                          </span>
                        </div>
                        <h3 class="mb-0 fw-bold">{{ totalCoach }}</h3>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="charts-wrapper d-flex mb-3">
                  <div class="chart-container">
                    <canvas id="canvas" width="350" height="350"></canvas>
                  </div>
                  <div class="chart-container">
                    <canvas id="canvasCoach" width="350" height="350"></canvas>
                  </div>
                  <div class="chart-container">
                    <canvas
                      id="percentageCanvas"
                      width="350"
                      height="350"
                    ></canvas>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <app-footer></app-footer>
      </div>
    </div>
  </body>
</html>
