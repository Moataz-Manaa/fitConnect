<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form Elements | Osen - Responsive Bootstrap 5 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      content="A fully featured admin theme which can be used to build CRM, CMS, etc."
      name="description"
    />
    <meta content="Coderthemes" name="author" />
  </head>

  <body>
    <div class="wrapper">
      <app-menu></app-menu>
      <header class="app-topbar">
        <app-header></app-header>
      </header>
      <div
        class="modal fade"
        id="searchModal"
        tabindex="-1"
        aria-labelledby="searchModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-lg">
          <div class="modal-content bg-transparent">
            <div class="card mb-1">
              <div
                class="px-3 py-2 d-flex flex-row align-items-center"
                id="top-search"
              >
                <i class="ti ti-search fs-22"></i>
                <input
                  type="search"
                  class="form-control border-0"
                  id="search-modal-input"
                  placeholder="Search for actions, people,"
                />
                <button
                  type="button"
                  class="btn p-0"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                >
                  [esc]
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-content">
        <div class="page-container">
          <div
            class="page-title-head d-flex align-items-sm-center flex-sm-row flex-column gap-2"
          >
            <div class="flex-grow-1">
              <h4 class="fs-18 fw-semibold mb-0">Espace Admin</h4>
            </div>
          </div>

          <div class="row">
            <div class="col-12">
              <div class="card">
                <div
                  class="card-header border-bottom border-dashed d-flex align-items-center"
                >
                  <h4 class="header-title">Ajouter Administrateur</h4>
                </div>

                <div class="card-body">
                  <div class="row">
                    <div class="col-lg-12">
                      <form (ngSubmit)="addNewAdmin()" [formGroup]="adminForm">
                        <div class="mb-3">
                          <label for="simpleinput" class="form-label"
                            >Nom</label
                          >
                          <input
                            formControlName="nom"
                            type="text"
                            id="simpleinput"
                            class="form-control"
                            placeholder="Nom"
                          />
                        </div>
                        <div *ngIf="nom?.touched && nom?.invalid">
                          <small
                            class="text-danger"
                            *ngIf="nom?.errors?.['required']"
                            >nom est obligatoire</small
                          >
                        </div>
                        <div class="mb-3">
                          <label for="simpleinput" class="form-label"
                            >Prénom</label
                          >
                          <input
                            formControlName="prenom"
                            type="text"
                            id="simpleinput"
                            class="form-control"
                            placeholder="Prenom"
                          />
                        </div>
                        <div *ngIf="prenom?.touched && prenom?.invalid">
                          <small
                            class="text-danger"
                            *ngIf="prenom?.errors?.['required']"
                            >prenom est obligatoire</small
                          >
                        </div>
                        <div class="mb-3">
                          <label for="example-email" class="form-label"
                            >Email</label
                          >
                          <input
                            formControlName="email"
                            type="email"
                            id="example-email"
                            name="example-email"
                            class="form-control"
                            placeholder="Email"
                          />
                        </div>
                        <div *ngIf="email?.touched && email?.invalid">
                          <small
                            class="text-danger"
                            *ngIf="email?.errors?.['required']"
                            >email est obligatoire</small
                          >
                        </div>
                        <div class="mb-3">
                          <label for="example-password" class="form-label"
                            >Mot de passe</label
                          >
                          <input
                            formControlName="mp"
                            type="password"
                            id="example-password"
                            class="form-control"
                            value=""
                          />
                        </div>
                        <div *ngIf="mp?.touched && mp?.invalid">
                          <small
                            class="text-danger"
                            *ngIf="mp?.errors?.['required']"
                            >mot de passe est obligatoire</small
                          >
                        </div>
                        <div class="mb-3">
                          <label for="example-select" class="form-label"
                            >Role</label
                          >
                          <select
                            formControlName="role"
                            class="form-select"
                            id="example-select"
                          >
                            <option value="Super Administrateur">
                              Super Administrateur
                            </option>
                            <option value="Sous Administrateur">
                              Sous Administrateur
                            </option>
                          </select>
                        </div>
                        <div *ngIf="role?.touched && role?.invalid">
                          <small
                            class="text-danger"
                            *ngIf="role?.errors?.['required']"
                            >role est obligatoire</small
                          >
                        </div>
                        <span [innerHTML]="this.messageCommande"></span>
                        <button type="submit" class="btn btn-primary mb-3">
                          Ajouter
                        </button>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <app-footer></app-footer>
      </div>
    </div>
  </body>
</html>
