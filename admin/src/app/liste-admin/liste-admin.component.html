<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Basic Tables | Osen - Responsive Bootstrap 5 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      content="A fully featured admin theme which can be used to build CRM, CMS, etc."
      name="description"
    />
    <meta content="Coderthemes" name="author" />
  </head>

  <body>
    <div class="wrapper">
      <app-menu></app-menu>
      <header class="app-topbar">
        <app-header></app-header>
      </header>
      <div
        class="modal fade"
        id="searchModal"
        tabindex="-1"
        aria-labelledby="searchModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-lg">
          <div class="modal-content bg-transparent">
            <div class="card mb-1">
              <div
                class="px-3 py-2 d-flex flex-row align-items-center"
                id="top-search"
              >
                <i class="ti ti-search fs-22"></i>
                <input
                  type="search"
                  class="form-control border-0"
                  id="search-modal-input"
                  placeholder="Search for actions, people,"
                />
                <button
                  type="button"
                  class="btn p-0"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                >
                  [esc]
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="page-content">
        <div class="page-container">
          <div
            class="page-title-head d-flex align-items-sm-center flex-sm-row flex-column gap-2"
          >
            <div class="flex-grow-1">
              <h4 class="fs-18 fw-semibold mb-0">Espace Admin</h4>
            </div>
          </div>
          <div class="row"></div>
          <div class="row">
            <div class="col-xl-12">
              <div class="card">
                <div
                  class="card-header border-bottom border-dashed d-flex align-items-center"
                >
                  <h4 class="header-title">Liste des administrateurs</h4>
                </div>
                <div class="card-body">
                  <a
                    href=""
                    class="btn btn-primary"
                    *ngIf="role == 'Super Administrateur'"
                    >Ajouter</a
                  >
                  <div class="table-responsive-sm">
                    <table class="table table-striped mb-0">
                      <thead>
                        <tr>
                          <th>Id</th>
                          <th>Nom</th>
                          <th>Prénom</th>
                          <th>Email</th>
                          <th>Role</th>
                          <th *ngIf="role == 'Super Administrateur'">Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr
                          *ngFor="
                            let admin of listeAdmin
                              | paginate : { itemsPerPage: 5, currentPage: p }
                          "
                        >
                          <td>{{ admin.id }}</td>
                          <td>{{ admin.nom }}</td>
                          <td>{{ admin.prenom }}</td>
                          <td>{{ admin.email }}</td>
                          <td>{{ admin.role }}</td>
                          <td
                            class="text-muted"
                            *ngIf="role == 'Super Administrateur'"
                          >
                            <a
                              href="/modifierAdmin/{{ admin.id }};"
                              class="link-reset fs-20 p-1"
                            >
                              <i class="ti ti-pencil"></i
                            ></a>
                            <a
                              href="javascript: void(0);"
                              class="link-reset fs-20 p-1"
                              (click)="DeleteAdmin(admin)"
                            >
                              <i class="ti ti-trash"></i
                            ></a>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                    <pagination-controls
                      style="text-align: right"
                      (pageChange)="p = $event"
                    ></pagination-controls>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <app-footer></app-footer>
      </div>
    </div>
  </body>
</html>
