<header class="adm-heading adm-heading-actions">
  <h1>Administrateurs</h1>
  <a *ngIf="canManage" class="adm-button" routerLink="/ajouter-admin">Ajouter un administrateur</a>
</header>
<p *ngIf="saveMessage" class="adm-notice adm-success" role="status">{{ saveMessage }}</p>
<app-management-table title="Administrateurs"
  [columns]="['ID','Nom','Prénom','Adresse e-mail']"
  statusColumn="Rôle" [hasActions]="canManage" [loadRows]="loadRows"></app-management-table>
