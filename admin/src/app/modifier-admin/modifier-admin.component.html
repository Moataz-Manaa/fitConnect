<header class="adm-heading"><h1>{{ title }}</h1></header>
<p *ngIf="loading" class="adm-notice" role="status">Chargement du compte…</p>
<div *ngIf="loadError" class="adm-notice adm-error" role="alert">
  {{ loadError }}
  <button class="adm-button adm-secondary" type="button" (click)="load()">Réessayer</button>
</div>
<section *ngIf="ready" class="adm-panel adm-editor">
  <form *ngIf="canEdit; else readOnly" class="adm-form" [formGroup]="form" (ngSubmit)="save()" [attr.aria-busy]="busy">
    <div class="adm-form-row">
      <label>Prénom<input formControlName="prenom" autocomplete="given-name" required /></label>
      <label>Nom<input formControlName="nom" autocomplete="family-name" required /></label>
    </div>
    <label>Adresse e-mail<input type="email" formControlName="email" autocomplete="email" required /></label>
    <label *ngIf="mode !== 'profile'">Rôle
      <select formControlName="role" required>
        <option value="">Choisir un rôle</option>
        <option>Sous Administrateur</option>
        <option>Super Administrateur</option>
      </select>
    </label>
    <label>{{ mode === 'create' ? 'Mot de passe' : 'Nouveau mot de passe (facultatif)' }}
      <input type="password" formControlName="mp" autocomplete="new-password" [required]="mode === 'create'" />
    </label>
    <p *ngIf="error" class="adm-notice adm-error" role="alert">{{ error }}</p>
    <p *ngIf="success" class="adm-notice adm-success" role="status">{{ success }}</p>
    <div class="adm-actions">
      <button class="adm-button" type="submit" [disabled]="busy">{{ busy ? 'Enregistrement…' : 'Enregistrer' }}</button>
      <a *ngIf="mode !== 'profile'" class="adm-button adm-secondary" routerLink="/listeAdmin">Retour à la liste</a>
    </div>
  </form>
  <ng-template #readOnly>
    <dl class="adm-facts">
      <dt>Nom</dt><dd>{{ form.controls.prenom.value }} {{ form.controls.nom.value }}</dd>
      <dt>Adresse e-mail</dt><dd>{{ form.controls.email.value }}</dd>
      <dt>Rôle</dt><dd>{{ form.controls.role.value || '—' }}</dd>
    </dl>
  </ng-template>
</section>
