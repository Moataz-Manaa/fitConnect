server:
  port: 8081
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fitconnect
    username: fitconnect
  mail:
    host: localhost
    port: 1025

fitconnect:
  google-client-id: ${FITCONNECT_GOOGLE_CLIENT_ID:46828070655-9cof32efubaq0sj90u5ntlqcj7eafc7q.apps.googleusercontent.com}
  urls:
    api-base-url: ${FITCONNECT_API_BASE_URL:http://localhost:${server.port}${server.servlet.context-path}}
