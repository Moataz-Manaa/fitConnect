<header class="fc-header" (keydown.escape)="closeMenus()">
  <div class="fc-wrap fc-header-inner">
    <a class="fc-brand" routerLink="/" (click)="closeMenus()" aria-label="FitConnect, accueil">
      <span class="fc-brand-icon" aria-hidden="true">F</span>Fit<span>Connect</span>
    </a>
    <button class="fc-menu-toggle fc-button fc-button-outline" type="button" (click)="menuOpen = !menuOpen"
      [attr.aria-expanded]="menuOpen" aria-controls="fc-navigation">{{ menuOpen ? 'Fermer' : 'Menu' }}</button>
    <nav id="fc-navigation" class="fc-nav" [class.fc-nav-open]="menuOpen" aria-label="Navigation principale">
      <a routerLink="/liste-salle" routerLinkActive="fc-active" ariaCurrentWhenActive="page" (click)="closeMenus()">Salles</a>
      <a routerLink="/coach" routerLinkActive="fc-active" ariaCurrentWhenActive="page" (click)="closeMenus()">Coachs</a>
      <a routerLink="/packs" routerLinkActive="fc-active" ariaCurrentWhenActive="page" (click)="closeMenus()">Abonnements</a>
      <a routerLink="/about" routerLinkActive="fc-active" ariaCurrentWhenActive="page" (click)="closeMenus()">À propos</a>
      <div class="fc-account">
        <button type="button" class="fc-button fc-button-primary" [attr.aria-expanded]="accountOpen"
          aria-controls="fc-account-links" (click)="accountOpen = !accountOpen">
          {{ role ? 'Mon espace' : 'Connexion' }} <span aria-hidden="true">⌄</span>
        </button>
        <div class="fc-account-links" id="fc-account-links" [hidden]="!accountOpen">
          <ng-container *ngIf="role; else signInLinks">
            <a *ngFor="let link of links" [routerLink]="link.url" (click)="closeMenus()">{{ link.label }}</a>
            <a routerLink="/edit-profile" (click)="closeMenus()">Mon profil</a>
            <button type="button" (click)="logout()">Déconnexion</button>
          </ng-container>
          <ng-template #signInLinks>
            <a routerLink="/loginClient" (click)="closeMenus()">Espace membre</a>
            <a routerLink="/loginCoach" (click)="closeMenus()">Espace coach</a>
            <a routerLink="/loginSalleDeSport" (click)="closeMenus()">Espace salle</a>
          </ng-template>
        </div>
      </div>
    </nav>
  </div>
</header>
