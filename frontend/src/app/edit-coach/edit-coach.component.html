  <body id="bg" class="data-typography-1">
    <div class="page-wraper">
      <app-header></app-header>
      <div class="page-content bg-white">
        <div class="container mt-4">
          <h2>Modifier Coach</h2>
          <div class="text-center" *ngIf="!coachForm">
            <p>Loading coach details...</p>
          </div>
          <div *ngIf="coachForm">
            <form
              class="row m-t30"
              (ngSubmit)="onSubmit()"
              [formGroup]="coachForm"
            >
              <div class="col-md-12">
                <div class="form-group m-b25">
                  <label class="label-title">Nom</label>
                  <input class="form-control" formControlName="nom" required />
                  <div
                    class="text-danger"
                    *ngIf="
                      coachForm.get('nom')?.touched &&
                      coachForm.get('nom')?.hasError('required')
                    "
                  >
                    Le nom est obligatoire
                  </div>
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group m-b25">
                  <label class="label-title">Prénom</label>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="prenom"
                    required
                  />
                  <div
                    class="text-danger"
                    *ngIf="
                      coachForm.get('prenom')?.touched &&
                      coachForm.get('prenom')?.hasError('required')
                    "
                  >
                    Le prénom est obligatoire
                  </div>
                </div>
              </div>
              <div class="col-md-12 m-b25">
                <div class="form-group">
                  <label class="label-title">Âge</label>
                  <input formControlName="age" class="form-control" required />
                  <div
                    class="text-danger"
                    *ngIf="
                      coachForm.get('age')?.touched &&
                      coachForm.get('age')?.hasError('required')
                    "
                  >
                    L'âge est obligatoire
                  </div>
                  <div
                    class="text-danger"
                    *ngIf="
                      coachForm.get('age')?.touched &&
                      coachForm.get('age')?.hasError('pattern')
                    "
                  >
                    L'âge doit être un nombre
                  </div>
                </div>
              </div>
              <div class="col-md-12 m-b25">
                <div class="form-group">
                  <label class="label-title">Activity</label>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="activity"
                    required
                  />
                  <div
                    class="text-danger"
                    *ngIf="
                      coachForm.get('activity')?.touched &&
                      coachForm.get('activity')?.hasError('required')
                    "
                  >
                    L'activité est obligatoire
                  </div>
                </div>
              </div>
              <div class="col-md-12 m-b25">
                <div class="form-group">
                  <label class="label-title">Image</label>
                  <div class="mb-3" *ngIf="imagePreview">
                    <img
                      [src]="imagePreview"
                      class="img-thumbnail"
                      style="max-height: 200px"
                      alt="Current image"
                    />
                  </div>
                  <input
                    type="file"
                    class="form-control"
                    (change)="onFileChange($event)"
                    accept="image/*"
                  />
                  <small class="form-text text-muted">
                    Laissez vide pour conserver l'image actuelle
                  </small>
                </div>
              </div>
              <div class="col-md-12 mb-4">
                <button
                  type="submit"
                  class="btn btn-primary rounded-0"
                  [disabled]="coachForm.invalid"
                >
                  Enregistrer les modifications
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <app-footer></app-footer>
    </div>
  </body>
</html>
