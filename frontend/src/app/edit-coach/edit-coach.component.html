<app-header></app-header>
<main class="fc-page fc-wrap fc-section fc-form-page">
  <a class="fc-text-link fc-back" routerLink="/mes-coach">← Équipe de la salle</a>
  <header class="fc-page-heading"><h1>{{ creating ? 'Ajouter un coach' : 'Modifier le profil' }}</h1></header>
  <app-page-state *ngIf="loading" kind="loading" message="Chargement du formulaire…"></app-page-state>
  <app-page-state *ngIf="loadError" kind="error" [message]="loadError" [retryable]="true" (retry)="load()"></app-page-state>
  <form *ngIf="ready" class="fc-card fc-card-body fc-form" [formGroup]="form" (ngSubmit)="save()" [attr.aria-busy]="saving">
    <div class="fc-field-row">
      <label class="fc-field">Prénom<input formControlName="prenom" autocomplete="given-name" required /></label>
      <label class="fc-field">Nom<input formControlName="nom" autocomplete="family-name" required /></label>
      <label class="fc-field">Âge<input formControlName="age" type="number" min="1" step="1" required /></label>
      <label class="fc-field">Activité<input formControlName="activity" required /></label>
    </div>
    <app-workspace-image [(image)]="image" [required]="creating" [disabled]="saving" (readingChange)="reading = $event"></app-workspace-image>
    <app-page-state *ngIf="error" kind="error" [message]="error"></app-page-state>
    <div class="fc-actions">
      <button class="fc-button fc-button-primary" type="submit" [disabled]="saving || reading">{{ saving ? 'Enregistrement…' : 'Enregistrer' }}</button>
      <a class="fc-button fc-button-outline" routerLink="/mes-coach">Annuler</a>
    </div>
  </form>
</main>
<app-footer></app-footer>
