<app-header></app-header>
<main class="fc-page fc-wrap fc-section">
  <a class="fc-text-link fc-back" routerLink="/coach">← Tous les coachs</a>
  <ng-container *ngIf="data$ | async as data">
    <app-page-state *ngIf="data.loading" kind="loading" message="Chargement du profil…"></app-page-state>
    <app-page-state *ngIf="data.error" kind="error" [message]="data.error" [retryable]="true" (retry)="load()"></app-page-state>
    <app-page-state *ngIf="!data.loading && !data.error && !data.value" message="Ce coach est indisponible."></app-page-state>
    <ng-container *ngIf="data.value as coach">
      <header class="fc-page-heading"><h1>{{ coach.prenom }} {{ coach.nom }}</h1></header>
      <div class="fc-detail-grid">
        <img *ngIf="coach.image; else placeholder" class="fc-detail-image" [src]="coach.image" alt="" />
        <ng-template #placeholder><div class="fc-card fc-card-placeholder" aria-hidden="true">{{ coach.prenom?.charAt(0) }}{{ coach.nom?.charAt(0) }}</div></ng-template>
        <section class="fc-card fc-card-body">
          <h2>Séances</h2>
          <p class="fc-muted">Consultez les activités et les horaires proposés par ce coach.</p>
          <a class="fc-button fc-button-primary" [routerLink]="['/seance', coach.id]">Voir ses séances</a>
        </section>
      </div>
    </ng-container>
  </ng-container>
</main>
<app-footer></app-footer>
