<app-header></app-header>
<main class="fc-page fc-wrap fc-section">
  <a class="fc-text-link fc-back" routerLink="/liste-salle">← Toutes les salles</a>
  <ng-container *ngIf="data$ | async as data">
    <app-page-state *ngIf="data.loading" kind="loading" message="Chargement de la salle…"></app-page-state>
    <app-page-state *ngIf="data.error" kind="error" [message]="data.error" [retryable]="true" (retry)="load()"></app-page-state>
    <app-page-state *ngIf="!data.loading && !data.error && !data.value" message="Cette salle est indisponible."></app-page-state>
    <ng-container *ngIf="data.value as profile">
      <header class="fc-page-heading">
        <h1>{{ profile.gym.nom }}</h1>
        <p *ngIf="profile.gym.adresse">{{ profile.gym.adresse }}</p>
      </header>
      <div class="fc-detail-grid">
        <img *ngIf="profile.gym.image; else placeholder" class="fc-detail-image" [src]="profile.gym.image" alt="" />
        <ng-template #placeholder><div class="fc-card fc-card-placeholder" aria-hidden="true">{{ profile.gym.nom?.charAt(0) }}</div></ng-template>
        <section class="fc-list" aria-labelledby="gym-packs">
          <h2 id="gym-packs">Abonnements</h2>
          <app-page-state *ngIf="!profile.packs.length" message="Cette salle n’a pas d’abonnement disponible."></app-page-state>
          <article class="fc-card fc-list-row" *ngFor="let pack of profile.packs">
            <div><h3>{{ pack.nom }}</h3><p class="fc-muted">{{ pack.category?.nom }}</p></div>
            <a class="fc-button fc-button-outline" [routerLink]="['/detail', pack.id]" [attr.aria-label]="'Voir l’offre : ' + pack.nom">Voir l’offre</a>
          </article>
        </section>
      </div>
      <section class="fc-block" aria-labelledby="gym-team">
        <div class="fc-section-heading"><h2 id="gym-team">L’équipe de la salle</h2></div>
        <app-page-state *ngIf="!profile.coaches.length" message="Aucun coach renseigné."></app-page-state>
        <div class="fc-grid" *ngIf="profile.coaches.length">
          <article class="fc-card" *ngFor="let coach of profile.coaches">
            <img *ngIf="coach.image" class="fc-card-image" [src]="coach.image" alt="" loading="lazy" />
            <div class="fc-card-body">
              <h3>{{ coach.prenom }} {{ coach.nom }}</h3>
              <p *ngIf="coach.activity" class="fc-muted">{{ coach.activity }}</p>
            </div>
          </article>
        </div>
      </section>
    </ng-container>
  </ng-container>
</main>
<app-footer></app-footer>
