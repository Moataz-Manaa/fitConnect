<app-header></app-header>
<main class="fc-page fc-wrap fc-section">
  <header class="fc-page-heading">
    <h1>Coachs</h1>
    <p>Trouvez un coach et consultez ses prochaines séances.</p>
  </header>
  <ng-container *ngIf="data$ | async as data">
    <app-page-state *ngIf="data.loading" kind="loading" message="Chargement des coachs…"></app-page-state>
    <app-page-state *ngIf="data.error" kind="error" [message]="data.error" [retryable]="true" (retry)="load()"></app-page-state>
    <ng-container *ngIf="data.value as items">
      <div class="fc-filter" *ngIf="items.length">
        <label class="fc-field">
          Rechercher un coach
          <input type="search" [(ngModel)]="query" (ngModelChange)="page = 1" placeholder="Nom ou prénom" />
        </label>
        <button *ngIf="query" class="fc-button fc-button-outline" type="button" (click)="query = ''; page = 1">Effacer les filtres</button>
      </div>
      <ng-container *ngIf="results(items) as matches">
        <p *ngIf="items.length" class="fc-result-count fc-muted" aria-live="polite">{{ matches.length }} {{ matches.length === 1 ? 'résultat' : 'résultats' }}</p>
        <app-page-state *ngIf="!matches.length" [message]="items.length ? 'Aucun résultat pour cette recherche.' : 'Aucun coach disponible pour le moment.'"></app-page-state>
        <div class="fc-grid" *ngIf="matches.length">
          <article class="fc-card fc-result-card" *ngFor="let item of matches | paginate: { itemsPerPage: 12, currentPage: page }">
            <img *ngIf="item.image; else placeholder" class="fc-card-image" [src]="item.image" alt="" loading="lazy" />
            <ng-template #placeholder><div class="fc-card-placeholder" aria-hidden="true">C</div></ng-template>
            <div class="fc-card-body">
              <h2>{{ (item.prenom || '') + ' ' + (item.nom || '') }}</h2>
              <a *ngIf="item.id" class="fc-button fc-button-outline" [routerLink]="['/detail-coach', item.id]" [attr.aria-label]="'Voir le coach : ' + ((item.prenom || '') + ' ' + (item.nom || ''))">Voir le coach</a>
            </div>
          </article>
        </div>
        <pagination-controls *ngIf="matches.length > 12" (pageChange)="page = $event" previousLabel="Précédent" nextLabel="Suivant" screenReaderPaginationLabel="Pagination" screenReaderPageLabel="Page" screenReaderCurrentLabel="Page actuelle"></pagination-controls>
      </ng-container>
    </ng-container>
  </ng-container>
</main>
<app-footer></app-footer>
