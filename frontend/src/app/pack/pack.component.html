<app-header></app-header>
<main class="fc-page fc-wrap fc-section">
  <header class="fc-page-heading">
    <h1>Abonnements</h1>
    <p>Comparez les offres des salles. Chaque abonnement couvre une période de 30 jours.</p>
  </header>
  <ng-container *ngIf="data$ | async as data">
    <app-page-state *ngIf="data.loading" kind="loading" message="Chargement des abonnements…"></app-page-state>
    <app-page-state *ngIf="data.error" kind="error" [message]="data.error" [retryable]="true" (retry)="load()"></app-page-state>
    <ng-container *ngIf="data.value as items">
      <div class="fc-filter" *ngIf="items.length">
        <label class="fc-field">
          Rechercher un abonnement
          <input type="search" [(ngModel)]="query" (ngModelChange)="page = 1" placeholder="Nom du pack ou de la salle" />
        </label>
        <label class="fc-field">
          Activité
          <select [(ngModel)]="category" (ngModelChange)="page = 1">
            <option value="">Toutes les activités</option>
            <option *ngFor="let name of categories(items)" [value]="name">{{ name }}</option>
          </select>
        </label>
        <button *ngIf="query || category" class="fc-button fc-button-outline" type="button" (click)="query = ''; category = ''; page = 1">Effacer les filtres</button>
      </div>
      <ng-container *ngIf="results(items) as matches">
        <p *ngIf="items.length" class="fc-result-count fc-muted" aria-live="polite">{{ matches.length }} {{ matches.length === 1 ? 'résultat' : 'résultats' }}</p>
        <app-page-state *ngIf="!matches.length" [message]="items.length ? 'Aucun résultat pour cette recherche.' : 'Aucune offre disponible pour le moment.'"></app-page-state>
        <div class="fc-grid" *ngIf="matches.length">
          <article class="fc-card fc-result-card" *ngFor="let item of matches | paginate: { itemsPerPage: 12, currentPage: page }">
            <img *ngIf="item.image; else placeholder" class="fc-card-image" [src]="item.image" alt="" loading="lazy" />
            <ng-template #placeholder><div class="fc-card-placeholder" aria-hidden="true">A</div></ng-template>
            <div class="fc-card-body">
              <h2>{{ item.nom }}</h2>
              <div class="fc-muted">
                <p *ngIf="item.salle?.nom">{{ item.salle?.nom }}</p>
                <p *ngIf="item.prix != null">{{ item.prix | number : '1.0-2' : 'fr' }} / 30 jours</p>
              </div>
              <a *ngIf="item.id" class="fc-button fc-button-outline" [routerLink]="['/detail', item.id]" [attr.aria-label]="'Voir l’offre : ' + (item.nom)">Voir l’offre</a>
            </div>
          </article>
        </div>
        <pagination-controls *ngIf="matches.length > 12" (pageChange)="page = $event" previousLabel="Précédent" nextLabel="Suivant" screenReaderPaginationLabel="Pagination" screenReaderPageLabel="Page" screenReaderCurrentLabel="Page actuelle"></pagination-controls>
      </ng-container>
    </ng-container>
  </ng-container>
</main>
<app-footer></app-footer>
