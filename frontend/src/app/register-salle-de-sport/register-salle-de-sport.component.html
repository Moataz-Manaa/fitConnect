  <body id="bg" class="data-typography-1">
    <div class="page-wraper">
      <!-- Header -->
      <app-header></app-header>

      <!-- Header -->

      <div class="page-content bg-white">
        <section class="p-0 mt-3 mb-3">
          <div class="row justify-content-center align-items-center">
            <div
              class="col-xxl-6 col-xl-6 col-lg-6 col-md-12 d-flex justify-content-center"
            >
              <div class="login-area wow fadeInUp" data-wow-delay="0.4s">
                <h2 class="title">Bienvenue</h2>
                <p class="text-white text-center m-b25">
                  veuillez créer votre compte
                </p>
                <div class="tab-content nav">
                  <form
                    id="login"
                    class="tab-pane active col-12"
                    (ngSubmit)="addNewSalleDeSport()"
                    [formGroup]="salleDeSportForm"
                  >
                    <div class="m-b30">
                      <label class="label-title">Nom de salle de sport</label>
                      <input
                        formControlName="nom"
                        name="dzName"
                        required=""
                        class="form-control"
                        placeholder="nom"
                      />
                    </div>
                    <div class="m-b30">
                      <label class="label-title">Téléphone</label>
                      <input
                        formControlName="telephone"
                        name="dzName"
                        required=""
                        class="form-control"
                        placeholder="téléphone"
                      />
                    </div>
                    <div class="m-b30">
                      <label class="label-title">Adresse</label>
                      <input
                        formControlName="adresse"
                        name="dzName"
                        required=""
                        class="form-control"
                        placeholder="adresse"
                      />
                    </div>
                    <div class="m-b30">
                      <label class="label-title">Logo de salle de sport</label>
                      <input
                        type="file"
                        (change)="onSelectFile($event)"
                        formControlName="image"
                        class="form-control"
                        name="dzName"
                        required="required"
                      />
                    </div>
                    <div class="m-b30">
                      <label class="label-title">Email</label>
                      <input
                        formControlName="email"
                        name="dzName"
                        required=""
                        class="form-control"
                        placeholder="email"
                        type="email"
                      />
                    </div>
                    <div class="m-b20">
                      <label class="label-title">Mot de passe</label>
                      <div class="secure-input">
                        <input
                          formControlName="mp"
                          type="password"
                          name="password"
                          class="form-control dz-password"
                          placeholder="mot de passe"
                        />
                        <div class="show-pass">
                          <i class="eye-open fa-regular fa-eye"></i>
                        </div>
                      </div>
                    </div>
                    <span [innerHTML]="this.messageCommande"></span>
                    <div class="text-center">
                      <button type="Submit" class="btn btn-primary m-b15 w-100">
                        s'inscrire
                      </button>
                      <a href="/loginSalleDeSport" class="btn-link"
                        >J'ai un compte <span> se connecter</span></a
                      >
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- Footer -->
      <app-footer></app-footer>

      <!-- Footer End -->
    </div>
