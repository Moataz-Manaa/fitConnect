<app-header></app-header>
<main class="fc-page fc-wrap fc-section">
  <header class="fc-page-heading"><h1>Mes clients</h1><p>Retrouvez les membres qui ont réservé une de vos séances.</p></header>
  <app-workspace-nav></app-workspace-nav>
  <ng-container *ngIf="data$ | async as data">
    <app-page-state *ngIf="data.loading" kind="loading" message="Chargement…"></app-page-state>
    <app-page-state *ngIf="data.error" kind="error" [message]="data.error" [retryable]="true" (retry)="load()"></app-page-state>
    <ng-container *ngIf="data.value as items">
      <div *ngIf="items.length" class="fc-filter">
        <label class="fc-field">Rechercher
          <input type="search" [(ngModel)]="query" (ngModelChange)="page = 1" placeholder="Nom ou e-mail" />
        </label>
      </div>
      <ng-container *ngIf="results(items) as matches">
        <app-page-state *ngIf="!matches.length" [message]="items.length ? 'Aucun résultat pour cette recherche.' : 'Aucun client pour le moment.'"></app-page-state>
        <div class="fc-grid" *ngIf="matches.length">
          <article class="fc-card fc-card-body" *ngFor="let item of matches | paginate: { itemsPerPage: 9, currentPage: page }">
            <div>
              <h2>{{ item.prenom }} {{ item.nom }}</h2>
            </div>
            <dl class="fc-facts">
              <ng-container *ngIf="item.email"><dt>E-mail</dt><dd><a class="fc-text-link" [href]="'mailto:' + item.email">{{ item.email }}</a></dd></ng-container>
              <ng-container *ngIf="item.telephone"><dt>Téléphone</dt><dd>{{ item.telephone }}</dd></ng-container>
              <ng-container *ngIf="item.age"><dt>Âge</dt><dd>{{ item.age }} ans</dd></ng-container>
            </dl>
          </article>
        </div>
        <pagination-controls *ngIf="matches.length > 9" (pageChange)="page = $event" previousLabel="Précédent" nextLabel="Suivant"
          screenReaderPaginationLabel="Pagination" screenReaderPageLabel="Page" screenReaderCurrentLabel="Page actuelle"></pagination-controls>
      </ng-container>
    </ng-container>
  </ng-container>
</main>
<app-footer></app-footer>
