<app-header></app-header>
<main class="fc-page fc-wrap fc-section">
  <a class="fc-text-link fc-back" routerLink="/packs">← Tous les abonnements</a>
  <ng-container *ngIf="data$ | async as data">
    <app-page-state *ngIf="data.loading" kind="loading" message="Chargement de l’abonnement…"></app-page-state>
    <app-page-state *ngIf="data.error" kind="error" [message]="data.error" [retryable]="true" (retry)="load()"></app-page-state>
    <app-page-state *ngIf="!data.loading && !data.error && !data.value" message="Cet abonnement est indisponible."></app-page-state>
    <ng-container *ngIf="data.value as pack">
      <header class="fc-page-heading"><h1>{{ pack.nom }}</h1><p *ngIf="pack.salle?.nom">{{ pack.salle?.nom }}</p></header>
      <div class="fc-detail-grid">
        <img *ngIf="pack.image; else placeholder" class="fc-detail-image" [src]="pack.image" alt="" />
        <ng-template #placeholder><div class="fc-card fc-card-placeholder" aria-hidden="true">A</div></ng-template>
        <section class="fc-card fc-card-body" aria-labelledby="pack-details-title">
          <h2 id="pack-details-title">Détails de l’abonnement</h2>
          <p *ngIf="pack.description">{{ pack.description }}</p>
          <dl class="fc-facts">
            <dt>Durée</dt><dd>30 jours</dd>
            <ng-container *ngIf="pack.category?.nom"><dt>Activité</dt><dd>{{ pack.category?.nom }}</dd></ng-container>
            <ng-container *ngIf="pack.prix != null"><dt>Tarif</dt><dd>{{ pack.prix | number : '1.0-2' : 'fr' }}</dd></ng-container>
          </dl>
          <form *ngIf="isMember; else login" class="fc-form" (ngSubmit)="startCheckout(pack.id)" [attr.aria-busy]="checkoutPending">
            <label class="fc-field">Date d’activation
              <input type="date" name="activation" [(ngModel)]="dateActivation" [min]="today" [disabled]="checkoutPending" required />
            </label>
            <app-page-state *ngIf="checkoutError" kind="error" [message]="checkoutError"></app-page-state>
            <button class="fc-button" type="submit" [disabled]="checkoutPending || !pack.id">{{ checkoutPending ? 'Préparation du paiement…' : 'Continuer vers le paiement' }}</button>
          </form>
          <ng-template #login><a *ngIf="pack.id" class="fc-button" routerLink="/loginClient" [queryParams]="{ returnTo: '/detail/' + pack.id }">Se connecter pour s’abonner</a></ng-template>
        </section>
      </div>
    </ng-container>
  </ng-container>
</main>
<app-footer></app-footer>
