<app-header></app-header>
<main class="fc-page fc-wrap fc-section fc-form-page">
  <header class="fc-page-heading"><h1>Nouveau mot de passe</h1></header>
  <section class="fc-card fc-card-body" [attr.aria-busy]="busy">
    <app-page-state *ngIf="error" kind="error" [message]="error"></app-page-state>
    <p *ngIf="complete" class="fc-form-note" role="status">Votre mot de passe a été mis à jour.</p>
    <form *ngIf="token && !complete" class="fc-form" (ngSubmit)="onResetPassword()">
      <label class="fc-field">Nouveau mot de passe
        <input type="password" name="password" [(ngModel)]="newPassword" autocomplete="new-password" required />
      </label>
      <button class="fc-button" type="submit" [disabled]="busy">{{ busy ? 'Enregistrement…' : 'Enregistrer le mot de passe' }}</button>
    </form>
    <a class="fc-text-link" routerLink="/loginClient">Retour à la connexion</a>
  </section>
</main>
<app-footer></app-footer>
