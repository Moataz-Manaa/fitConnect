  <body id="bg" class="data-typography-1">
    <div class="page-wraper">
      <!-- Header -->
      <app-header></app-header>

      <!-- Page Content -->
      <div class="page-content bg-white">
        <section class="p-0 overflow-hidden">
          <div class="row">
            <!-- Left Side: Banner Slider -->
            <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-12 p-a0">
              <div class="swiper login-slider">
                <div class="swiper-wrapper">
                  <div class="swiper-slide">
                    <div
                      class="banner-login"
                      style="
                        background-image: url(assets/images/about/image-box/pic1.jpg);
                      "
                    >
                      <div class="banner-content">
                        <h2 class="title wow fadeInUp" data-wow-delay="0.4s">
                          Reset Your Password
                        </h2>
                        <p class="text wow fadeInUp" data-wow-delay="0.6s">
                          Enter your new password to regain access to your
                          PowerZone account.
                        </p>
                      </div>
                    </div>
                  </div>
                  <!-- You can add more slides if needed -->
                </div>
                <div class="container">
                  <div
                    class="num-pagination wow fadeInUp"
                    data-wow-delay="0.8s"
                  >
                    <div
                      class="swiper-pagination main-pagination style-2"
                    ></div>
                  </div>
                </div>
                <div class="main-btn wow fadeInUp" data-wow-delay="1.0s">
                  <div class="main-btn-prev btn-prev">
                    <i class="fa-solid fa-arrow-left"></i>
                  </div>
                  <div class="main-btn-next btn-next">
                    <i class="fa-solid fa-arrow-right"></i>
                  </div>
                </div>
              </div>
            </div>

            <!-- Right Side: Reset Password Form -->
            <div class="col-xxl-6 col-xl-6 col-lg-6 col-md-12 end-side-content">
              <div
                class="login-area sticky-top wow fadeInUp"
                data-wow-delay="0.4s"
              >
                <h2 class="title">Reset Your Password</h2>
                <p class="text-white text-center m-b25">
                  Please enter your new password below
                </p>
                <div class="tab-content nav">
                  <form
                    (ngSubmit)="onResetPassword()"
                    id="reset-password"
                    class="tab-pane active col-12"
                  >
                    <div class="m-b10">
                      <label class="label-title">New Password</label>
                      <div class="secure-input">
                        <input
                          [(ngModel)]="newPassword"
                          name="newPassword"
                          type="password"
                          class="form-control dz-password"
                          placeholder="Enter new password"
                          required
                        />
                      </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 m-t15">
                      Reset Password
                    </button>
                    <p *ngIf="message" class="text-success m-t15">
                      {{ message }}
                    </p>
                    <p *ngIf="errorMessage" class="text-danger m-t15">
                      {{ errorMessage }}
                    </p>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- Footer -->
      <app-footer></app-footer>
    </div>
