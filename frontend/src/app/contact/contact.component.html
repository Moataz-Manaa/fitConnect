<app-header></app-header>
<main class="fc-page fc-wrap fc-section fc-form-page">
  <header class="fc-page-heading"><h1>Contacter FitConnect</h1><p>Une question sur votre compte, une séance ou un abonnement ? Écrivez-nous.</p></header>
  <form class="fc-card fc-card-body fc-form" [formGroup]="contactForm" (ngSubmit)="addNewContact()" [attr.aria-busy]="busy">
    <label class="fc-field">Nom<input formControlName="nom" autocomplete="name" required /></label>
    <div class="fc-field-row">
      <label class="fc-field">Adresse e-mail<input type="email" formControlName="email" autocomplete="email" required /></label>
      <label class="fc-field">Téléphone<input type="tel" formControlName="telephone" autocomplete="tel" required /></label>
    </div>
    <label class="fc-field">Sujet<input formControlName="sujet" required /></label>
    <label class="fc-field">Message<textarea formControlName="message" rows="5" required></textarea></label>
    <app-page-state *ngIf="error" kind="error" [message]="error"></app-page-state>
    <p *ngIf="sent" class="fc-form-note" role="status">Votre message a été envoyé.</p>
    <button class="fc-button" type="submit" [disabled]="busy">{{ busy ? 'Envoi…' : 'Envoyer le message' }}</button>
  </form>
</main>
<app-footer></app-footer>
