  <body id="bg" class="data-typography-1">
    <div class="page-wraper">
      <!-- Header -->
      <app-header></app-header>

      <!-- Header -->

      <div class="page-content bg-white">
        <!--banner-->
        <div
          class="contact-bnr"
          style="background-image: url(assets/images/background/bg9.png)"
        >
          <div class="container">
            <div class="row">
              <div class="col-lg-6" style="height: 100vh">
                <div class="contact-info style-1 text-start text-white">
                  <h2 class="title wow fadeInUp" data-wow-delay="0.1s">
                    Contactez-nous
                  </h2>
                  <p class="text wow fadeInUp" data-wow-delay="0.2s">
                    <span class="text-decoration-underline text-white">
                      PowerZone est là pour vous aider;
                    </span>
                    <br />
                    Nos experts sont là pour répondre à toutes vos questions.
                    Nous avons les réponses.
                  </p>
                  <div
                    class="contact-bottom wow fadeInUp"
                    data-wow-delay="0.3s"
                  ></div>
                </div>
              </div>
              <div class="col-lg-6">
                <div
                  class="contact-area1 style-1 m-r20 m-md-r0 wow fadeInUp"
                  data-wow-delay="0.5s"
                >
                  <form
                    class="dz-form dzForm"
                    (ngSubmit)="addNewContact()"
                    [formGroup]="contactForm"
                  >
                    <input
                      type="hidden"
                      class="form-control"
                      name="dzToDo"
                      value="Contact"
                    />
                    <input
                      type="hidden"
                      class="form-control"
                      name="reCaptchaEnable"
                      value="0"
                    />

                    <label class="form-label">Nom et Prénom</label>
                    <div class="input-group">
                      <input
                        formControlName="nom"
                        required
                        type="text"
                        class="form-control"
                        name="dzName"
                      />
                    </div>
                    <label class="form-label">Email</label>
                    <div class="input-group">
                      <input
                        formControlName="email"
                        required
                        type="text"
                        class="form-control"
                        name="dzEmail"
                      />
                    </div>
                    <label class="form-label">Téléphone</label>
                    <div class="input-group">
                      <input
                        formControlName="telephone"
                        required
                        type="text"
                        class="form-control"
                        name="dzPhoneNumber"
                      />
                    </div>
                    <label class="form-label">Sujet</label>
                    <div class="input-group">
                      <input
                        formControlName="sujet"
                        required
                        type="text"
                        class="form-control"
                        name="dzSubject"
                      />
                    </div>
                    <label class="form-label">Massage</label>
                    <div class="input-group m-b30">
                      <textarea
                        formControlName="message"
                        name="dzMessage"
                        rows="4"
                        required
                        class="form-control m-b10"
                      ></textarea>
                    </div>

                    <span [innerHTML]="this.messageCommande"></span>
                    <div>
                      <button
                        name="submit"
                        type="submit"
                        class="btn btn-primary w-100 btnhover"
                      >
                        Envoyer
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <app-footer></app-footer>

      <!-- Footer End -->
    </div>
