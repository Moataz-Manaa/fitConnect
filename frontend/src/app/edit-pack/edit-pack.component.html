  <body id="bg" class="data-typography-1">
    <div class="page-wraper">
      <app-header></app-header>

      <div class="page-content bg-white">
        <!-- Banner  -->

        <!-- Banner End -->

        <!-- inner page banner End-->
        <!-- editPack.html -->
        <div class="container mt-4">
          <h2>Modifier Pack</h2>

          <div class="text-center" *ngIf="!packForm">
            <p>Loading pack details...</p>
          </div>

          <div *ngIf="packForm">
            <form
              class="row m-t30"
              (ngSubmit)="onSubmit()"
              [formGroup]="packForm"
            >
              <div class="col-md-12">
                <div class="form-group m-b25">
                  <label class="label-title">Nom</label>
                  <input class="form-control" formControlName="nom" required />
                  <div
                    class="text-danger"
                    *ngIf="
                      packForm.get('nom')?.touched &&
                      packForm.get('nom')?.hasError('required')
                    "
                  >
                    Le nom est obligatoire
                  </div>
                </div>
              </div>

              <div class="col-md-12">
                <div class="form-group m-b25">
                  <label class="label-title">Prix</label>
                  <input
                    type="number"
                    class="form-control"
                    formControlName="prix"
                    required
                  />
                  <div
                    class="text-danger"
                    *ngIf="
                      packForm.get('prix')?.touched &&
                      packForm.get('prix')?.hasError('required')
                    "
                  >
                    Le prix est obligatoire
                  </div>
                </div>
              </div>

              <div class="col-md-12">
                <div class="m-b25">
                  <label class="label-title">Catégorie</label>
                  <select
                    class="form-control"
                    formControlName="idCategory"
                    required
                  >
                    <option value="">Sélectionner une catégorie</option>
                    <option
                      *ngFor="let category of categories"
                      [value]="category.id"
                    >
                      {{ category.nom }}
                    </option>
                  </select>
                  <div
                    class="text-danger"
                    *ngIf="
                      packForm.get('idCategory')?.touched &&
                      packForm.get('idCategory')?.hasError('required')
                    "
                  >
                    La catégorie est obligatoire
                  </div>
                </div>
              </div>

              <div class="col-md-12 m-b25">
                <div class="form-group">
                  <label class="label-title">Description</label>
                  <textarea
                    formControlName="description"
                    class="form-control"
                    cols="90"
                    rows="5"
                    required
                  ></textarea>
                  <div
                    class="text-danger"
                    *ngIf="
                      packForm.get('description')?.touched &&
                      packForm.get('description')?.hasError('required')
                    "
                  >
                    La description est obligatoire
                  </div>
                </div>
              </div>

              <div class="col-md-12 m-b25">
                <div class="form-group">
                  <label class="label-title">Image</label>
                  <div class="mb-3" *ngIf="imagePreview">
                    <img
                      [src]="imagePreview"
                      class="img-thumbnail"
                      style="max-height: 200px"
                      alt="Current image"
                    />
                  </div>
                  <input
                    type="file"
                    class="form-control"
                    (change)="onFileChange($event)"
                    accept="image/*"
                  />
                  <small class="form-text text-muted">
                    Laissez vide pour conserver l'image actuelle
                  </small>
                </div>
              </div>

              <div class="col-md-12 mb-4">
                <button
                  type="submit"
                  class="btn btn-primary rounded-0"
                  [disabled]="packForm.invalid"
                >
                  Enregistrer les modifications
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <app-footer></app-footer>
    </div>
