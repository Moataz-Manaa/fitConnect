<app-header></app-header>
<main class="fc-page fc-wrap fc-section fc-form-page">
  <a class="fc-text-link fc-back" routerLink="/mesPacks">← Mes packs</a>
  <header class="fc-page-heading"><h1>{{ creating ? 'Ajouter un pack' : 'Modifier le pack' }}</h1></header>
  <app-page-state *ngIf="loading" kind="loading" message="Chargement du formulaire…"></app-page-state>
  <app-page-state *ngIf="loadError" kind="error" [message]="loadError" [retryable]="true" (retry)="load()"></app-page-state>
  <form *ngIf="ready" class="fc-card fc-card-body fc-form" [formGroup]="form" (ngSubmit)="save()" [attr.aria-busy]="saving">
    <label class="fc-field">Nom du pack<input formControlName="nom" required /></label>
    <label class="fc-field">Description<textarea formControlName="description" required></textarea></label>
    <div class="fc-field-row">
      <label class="fc-field">Prix pour 30 jours<input formControlName="prix" type="number" min="0.01" step="0.01" required /></label>
      <label class="fc-field">Activité
        <select formControlName="idCategory" required>
          <option [ngValue]="null">Choisir une activité</option>
          <option *ngFor="let category of categories" [ngValue]="category.id">{{ category.nom }}</option>
        </select>
      </label>
    </div>
    <app-page-state *ngIf="!categories.length" message="Aucune activité n’est disponible pour ce pack."></app-page-state>
    <app-workspace-image [(image)]="image" [required]="creating" [disabled]="saving" (readingChange)="reading = $event"></app-workspace-image>
    <app-page-state *ngIf="error" kind="error" [message]="error"></app-page-state>
    <div class="fc-actions">
      <button class="fc-button fc-button-primary" type="submit" [disabled]="saving || reading || !categories.length">{{ saving ? 'Enregistrement…' : 'Enregistrer' }}</button>
      <a class="fc-button fc-button-outline" routerLink="/mesPacks">Annuler</a>
    </div>
  </form>
</main>
<app-footer></app-footer>
