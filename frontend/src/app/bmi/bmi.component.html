<app-header></app-header>
<main class="fc-page fc-wrap fc-section fc-form-page">
  <header class="fc-page-heading">
    <h1>Calculer mon IMC</h1>
    <p>Saisissez votre poids et votre taille pour calculer votre indice de masse corporelle.</p>
  </header>
  <form class="fc-card fc-card-body fc-form" (ngSubmit)="calculate()">
    <div class="fc-field-row">
      <label class="fc-field">Poids (kg)
        <input name="weight" type="number" inputmode="decimal" min="0.01" step="any" required [(ngModel)]="weight" (ngModelChange)="submitted = false" />
      </label>
      <label class="fc-field">Taille (cm)
        <input name="height" type="number" inputmode="decimal" min="0.01" step="any" required [(ngModel)]="height" (ngModelChange)="submitted = false" />
      </label>
    </div>
    <button class="fc-button" type="submit">Calculer</button>
    <app-page-state *ngIf="submitted && result === null" kind="error" message="Saisissez un poids et une taille supérieurs à zéro."></app-page-state>
    <output *ngIf="submitted && result !== null" class="fc-form-note">Votre IMC est de <strong>{{ result | number : '1.1-1' : 'fr' }} kg/m²</strong>.</output>
  </form>
</main>
<app-footer></app-footer>
