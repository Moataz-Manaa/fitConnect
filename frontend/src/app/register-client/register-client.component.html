<app-header></app-header>
<main class="fc-page fc-wrap fc-section fc-form-page">
  <header class="fc-page-heading"><h1>Créer un compte membre</h1><p>Réservez des séances et gérez vos abonnements depuis votre compte FitConnect.</p></header>
  <section class="fc-card fc-card-body" [attr.aria-busy]="busy">
    <p *ngIf="registered" class="fc-form-note" role="status">Compte créé. Consultez votre boîte e-mail et suivez le lien de confirmation pour activer votre compte.</p>
    <form *ngIf="!registered" class="fc-form" [formGroup]="clientForm" (ngSubmit)="addNewClient()">
      <div class="fc-field-row">
        <label class="fc-field">Prénom<input formControlName="prenom" autocomplete="given-name" required /></label>
        <label class="fc-field">Nom<input formControlName="nom" autocomplete="family-name" required /></label>
        <label class="fc-field">Téléphone<input type="tel" formControlName="telephone" autocomplete="tel" required /></label>
        <label class="fc-field">Âge<input type="number" formControlName="age" inputmode="numeric" min="1" required /></label>
      </div>
      <label class="fc-field">Adresse e-mail<input type="email" formControlName="email" autocomplete="email" required /></label>
      <label class="fc-field">Mot de passe<input type="password" formControlName="mp" autocomplete="new-password" required /></label>
      <app-page-state *ngIf="error" kind="error" [message]="error"></app-page-state>
      <button class="fc-button" type="submit" [disabled]="busy">{{ busy ? 'Création du compte…' : 'Créer mon compte' }}</button>
    </form>
    <p class="fc-form-footer"><a class="fc-text-link" routerLink="/loginClient" queryParamsHandling="preserve">Se connecter</a></p>
  </section>
</main>
<app-footer></app-footer>
