  <body id="bg" class="data-typography-1">
    <div class="page-wraper">
      <app-header></app-header>

      <div class="page-content bg-white">
        <!-- inner page banner End-->
        <div class="content-inner-1">
          <div class="container">
            <div
              class="row shop-checkout"
              style="margin: 0 auto; max-width: 800px"
            >
              <h1>Ajouter votre pack</h1>
              <div class="col-xl-8">
                <form
                  class="row m-t30"
                  (ngSubmit)="addNewAjouter()"
                  [formGroup]="packForm"
                >
                  <div class="col-md-12">
                    <div class="form-group m-b25">
                      <label class="label-title">Nom</label>
                      <input
                        name="dzName"
                        required=""
                        class="form-control"
                        formControlName="nom"
                      />
                    </div>
                  </div>
                  <div class="col-md-12">
                    <div class="form-group m-b25">
                      <label class="label-title">Prix</label>
                      <input
                        name="dzName"
                        required=""
                        class="form-control"
                        formControlName="prix"
                      />
                    </div>
                  </div>
                  <div class="col-md-12">
                    <div class="m-b25">
                      <label class="label-title">Catégorie</label>
                      <div>
                        <select formControlName="category" class="form-control">
                          <option
                            *ngFor="let cat of listeCategory"
                            value="{{ cat.id }}"
                          >
                            {{ cat.nom }}
                          </option>
                        </select>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-12 m-b25">
                    <div class="form-group">
                      <label class="label-title">Description</label>
                      <textarea
                        formControlName="description"
                        id="comments"
                        class="form-control"
                        name="comment"
                        cols="90"
                        rows="5"
                        required="required"
                      ></textarea>
                    </div>
                  </div>
                  <div class="col-md-12 m-b25">
                    <div class="form-group">
                      <label class="label-title">Image</label>
                      <input
                        (change)="onSelectFile($event)"
                        type="file"
                        formControlName="image"
                        id="comments"
                        class="form-control"
                        name="comment"
                        required="required"
                      />
                    </div>
                  </div>
                  <div>
                    <button type="submit" class="btn btn-primary rounded-0">
                      Ajouter
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <app-footer></app-footer>
    </div>
  </body>
