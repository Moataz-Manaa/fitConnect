<!-- revenue.component.html -->
<app-header></app-header>
<div class="container mt-4 mb-4">
  <h2 class="mb-4">Tableau de bord des revenus pour la salle de sport</h2>

  <!-- Year Selection -->
  <div class="mb-4">
    <label for="year" class="form-label">Sélectionnez l'année :</label>
    <select
      id="year"
      [(ngModel)]="selectedYear"
      (ngModelChange)="onYearChange()"
      class="form-select"
    >
      <option *ngFor="let year of years" [value]="year">{{ year }}</option>
    </select>
  </div>

  <!-- Grid Layout for Charts -->
  <div class="row g-4">
    <!-- Total Revenue Card -->
    <div class="col-md-6 col-lg-3">
      <div class="card h-100">
        <div class="card-body text-center">
          <h3 class="card-title">Chiffre d'affaires annuel total</h3>
          <p class="card-text fs-3 text-primary">
            {{ totalRevenue | number : "1.2-2" }} D
          </p>
        </div>
      </div>
    </div>

    <!-- Bar Chart (Monthly Revenue) -->
    <div class="col-md-6 col-lg-9">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title">Chiffre d'affaires mensuel</h3>
          <div class="chart-container">
            <canvas
              baseChart
              #barChart
              [data]="barChartData"
              [options]="barChartOptions"
              [type]="barChartType"
            ></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Pie Chart (Revenue by Pack) -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title">Répartition des revenus par pack</h3>
          <div class="chart-container">
            <canvas
              baseChart
              #pieChart
              [data]="pieChartData"
              [options]="pieChartOptions"
              [type]="pieChartType"
            ></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Line Chart (Year-over-Year Revenue) -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title">Tendance des revenus annuels</h3>
          <div class="chart-container">
            <canvas
              baseChart
              #lineChart
              [data]="lineChartData"
              [options]="lineChartOptions"
              [type]="lineChartType"
            ></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
